    <!-- Prevent dark mode flash -->
    <script>
      (function () {
        const stored = localStorage.getItem('darkMode');
        const isDark =
          stored === 'true' ||
          (stored === null &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
